<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .navbar {
            width: 100%;
            background: #111;
            color: #fff;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; 
            row-gap: 15px;   
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links li a {
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            display: inline-block;
        }

        .nav-right {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">ShopEase</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Deals</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="nav-right">
            <a href="#" style="color:white; text-decoration:none;">Cart 🛒</a>
            <a href="#" style="color:white; text-decoration:none;">Login</a>
        </div>
    </nav>

    <h2 style="margin:20px;">Welcome to ShopEase!</h2>
    <p style="margin-left:20px;">Your one-stop destination for all shopping needs.</p>

</body>
</html>
